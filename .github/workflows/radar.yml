name: Radar scan
run-name: Radar scan ${{ inputs.slot || inputs.reason || github.event_name }}

"on":
  schedule:
    - cron: "*/10 14-19 * * 1-5"
    - cron: "0 20 * * 1-5"
  workflow_dispatch:
    inputs:
      reason:
        description: Motivo del disparo
        required: false
        type: string
      slot:
        description: Slot ART
        required: false
        type: string
      scheduled_at:
        description: Timestamp autorizado por Cloudflare
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: felix-radar-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Decidir si corresponde radar
        id: gate
        env:
          DASHBOARD_API_URL: ${{ secrets.DASHBOARD_API_URL }}
          SCANNER_SECRET: ${{ secrets.SCANNER_SECRET }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RESPONSE=$(curl -fsS \
            -H "Authorization: Bearer $SCANNER_SECRET" \
            "$DASHBOARD_API_URL/internal/radar-due")
          echo "$RESPONSE"
          RUN=$(python3 -c 'import json,sys; print("true" if json.load(sys.stdin).get("run") else "false")' <<< "$RESPONSE")
          REASON=$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("reason", ""))' <<< "$RESPONSE")
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - name: Scan radar V4.2 + compra fuerte excepcional
        if: steps.gate.outputs.run == 'true'
        working-directory: scanner
        env:
          SCAN_MODE: radar
          SCAN_AT: ${{ inputs.scheduled_at }}
          DASHBOARD_API_URL: ${{ secrets.DASHBOARD_API_URL }}
          SCANNER_SECRET: ${{ secrets.SCANNER_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          chmod +x ./felix_dashboard_scanner
          ./felix_dashboard_scanner serverless-scan

      - name: Sin scan en este ciclo
        if: steps.gate.outputs.run != 'true'
        run: echo "Radar no requerido en este ciclo (${{ steps.gate.outputs.reason }})."
